name: Scientific checks
on: [push, pull_request]
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt pytest nbformat
      - run: python -m pytest -q
      - run: python tools/build_notebooks.py
      - run: git diff --exit-code -- notebooks
